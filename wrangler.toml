name = "ffmotor-api"
main = "apps/api/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ffmotor_db"
database_id = "ffmotor_local_db"
migrations_dir = "packages/db/migrations"

# Cloudflare R2 Bucket (Video bukti 5s, foto part, PDF passport)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ffmotor-assets"

# Cloudflare Cron Triggers (Setiap malam jam 2 pagi kira ramalan mileage & peringatan servis)
[triggers]
crons = ["0 2 * * *"]

